<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Arte com Arquivos Locais</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Galeria de Arte</h1>
        <p>Envie fotos diretamente do seu computador</p>
    </header>

    <main class="container">
        <!-- Formulário para upload do computador -->
        <section class="form-section">
            <h2>Adicionar Nova Obra</h2>
            <form id="form-arte">
                <div class="input-group">
                    <label for="titulo">Nome da Arte:</label>
                    <input type="text" id="titulo" required placeholder="Ex: Noite Estrelada">
                </div>
                <div class="input-group">
                    <label for="autor">Autor:</label>
                    <input type="text" id="autor" required placeholder="Ex: Vincent van Gogh">
                </div>
                <div class="input-group">
                    <label for="valor">Valor (R$):</label>
                    <input type="text" id="valor" required placeholder="Ex: 1.500,00">
                </div>
                <div class="input-group">
                    <label for="imagem">Escolher Foto do Computador:</label>
                    <input type="file" id="imagem" accept="image/*" required>
                </div>
                <button type="submit">Cadastrar Obra</button>
            </form>
        </section>

        <!-- Galeria de Cards -->
        <section>
            <h2>Obras em Exibição</h2>
            <div class="galeria" id="galeria-container">
                <!-- Os cards inseridos aparecem aqui -->
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
